      <linearGradient id="mmv2-4-body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fa"></stop><stop offset="1" stop-color="#bdccd7"></stop></linearGradient>
      <linearGradient id="mmv2-4-edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8296a5"></stop><stop offset=".45" stop-color="#c8d5de"></stop><stop offset="1" stop-color="#8294a1"></stop></linearGradient>
      <linearGradient id="mmv2-4-dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#364751"></stop><stop offset="1" stop-color="#202e37"></stop></linearGradient>
      <linearGradient id="mmv2-4-steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf4f8"></stop><stop offset=".4" stop-color="#c5d3dc"></stop><stop offset="1" stop-color="#8da2b2"></stop></linearGradient>
      <linearGradient id="mmv2-4-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#425b6a"></stop><stop offset="1" stop-color="#283e4a"></stop></linearGradient>
