    </defs><style>
      #mmv2-4{overflow:visible;display:block;isolation:isolate}
      #mmv2-4 .mm-line{stroke:#738996;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}
      #mmv2-4 .mm-fine{fill:none;stroke:#9cabb5;stroke-width:.85;stroke-linecap:round}
      #mmv2-4 .mm-focus{fill:#ef9c36;fill-opacity:.12;stroke:#e29632;stroke-width:2;stroke-linejoin:round;animation:mmv2-4-pulse 2.5s ease-in-out infinite}
      #mmv2-4 .mm-area{stroke-dasharray:4 3}
      #mmv2-4 .mm-arrow{fill:none;stroke:#2475cc;stroke-width:2.4;stroke-linecap:round;marker-end:url(#mmv2-4-arrow);animation:mmv2-4-arrow 2.8s ease-in-out infinite}
      #mmv2-4 .mm-paper{animation:mmv2-4-paper 3.5s ease-in-out infinite}
      #mmv2-4 .mm-paper-up{animation:mmv2-4-paper-up 3.5s ease-in-out infinite}
      #mmv2-4 .mm-wipe{animation:mmv2-4-wipe 3.6s ease-in-out infinite}
      #mmv2-4 .mm-spark{animation:mmv2-4-spark 3.6s ease-in-out infinite}
      #mmv2-4 .mm-upper-lid{transform-origin:240px 126px;transform:scaleY(1)}
      #mmv2-4 .mm-upper-under{opacity:1}
      #mmv2-4 .mm-upper-outside{opacity:0}
      #mmv2-4 .mm-mechanism .mm-upper-lid{animation:mmv2-4-lid 4.7s ease-in-out infinite}
      #mmv2-4 .mm-mechanism .mm-upper-under{animation:mmv2-4-under 4.7s ease-in-out infinite}
      #mmv2-4 .mm-mechanism .mm-upper-outside{animation:mmv2-4-outside 4.7s ease-in-out infinite}
      #mmv2-4 .mm-lower-tray{transform:translateY(-56px)}
      #mmv2-4 .mm-lower-face{transform:translateY(0px)}
      #mmv2-4 .mm-lower-handle-target{opacity:1}
      #mmv2-4 .mm-lower-passage-target{opacity:0}
      #mmv2-4 .mm-mechanism .mm-lower-tray{animation:mmv2-4-tray 4.7s ease-in-out infinite}
      #mmv2-4 .mm-mechanism .mm-lower-face{animation:mmv2-4-face 4.7s ease-in-out infinite}
      #mmv2-4 .mm-mechanism .mm-lower-handle-target{animation:mmv2-4-handle-target 4.7s ease-in-out infinite}
      #mmv2-4 .mm-mechanism .mm-lower-passage-target{animation:mmv2-4-passage-target 4.7s ease-in-out infinite}
      #mmv2-4 .mm-reverse .mm-upper-lid,#mmv2-4 .mm-reverse .mm-upper-under,#mmv2-4 .mm-reverse .mm-upper-outside,#mmv2-4 .mm-reverse .mm-lower-tray,#mmv2-4 .mm-reverse .mm-lower-face,#mmv2-4 .mm-reverse .mm-lower-handle-target,#mmv2-4 .mm-reverse .mm-lower-passage-target{animation-direction:reverse}
      #mmv2-4.mm-paused *{animation-play-state:paused!important}
      #mmv2-4.mm-still *{animation:none!important}
      @keyframes mmv2-4-pulse{0%,100%{fill-opacity:.10;stroke-opacity:.7}50%{fill-opacity:.22;stroke-opacity:1}}
      @keyframes mmv2-4-arrow{0%,100%{opacity:.5}40%,75%{opacity:1}}
      @keyframes mmv2-4-paper{0%,20%{transform:translate(0,0);opacity:1}76%,94%{transform:translate(39px,-28px);opacity:1}100%{transform:translate(39px,-28px);opacity:0}}
      @keyframes mmv2-4-paper-up{0%,20%{transform:translate(0,0);opacity:1}76%,94%{transform:translate(0,-32px);opacity:1}100%{transform:translate(0,-32px);opacity:0}}
      @keyframes mmv2-4-wipe{0%,100%{transform:translateX(-25px)}50%{transform:translateX(25px)}}
      @keyframes mmv2-4-spark{0%,25%,100%{opacity:.15}50%,75%{opacity:1}}
      @keyframes mmv2-4-lid{0%,15%{transform:scaleY(-.85)}65%,100%{transform:scaleY(1)}}
      @keyframes mmv2-4-under{0%,37%{opacity:0}45%,100%{opacity:1}}
      @keyframes mmv2-4-outside{0%,37%{opacity:1}45%,100%{opacity:0}}
      @keyframes mmv2-4-tray{0%,15%{transform:translateY(-56px)}65%,100%{transform:translateY(0)}}
      @keyframes mmv2-4-face{0%,15%{transform:translateY(0)}65%,100%{transform:translateY(56px)}}
      @keyframes mmv2-4-handle-target{0%,20%{opacity:1}48%,100%{opacity:0}}
      @keyframes mmv2-4-passage-target{0%,22%{opacity:0}50%,100%{opacity:1}}
      @media(prefers-reduced-motion:reduce){#mmv2-4 *{animation:none!important}}
    </style><ellipse cx="240" cy="282" rx="110" ry="4" fill="#697f8e" opacity=".16" filter="url(#mmv2-4-shadow)"></ellipse>
