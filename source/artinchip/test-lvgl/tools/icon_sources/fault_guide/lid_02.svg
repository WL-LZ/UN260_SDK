      #mmv2-7 .mm-mechanism .mm-upper-outside{animation:mmv2-7-outside 4.7s ease-in-out infinite}
      #mmv2-7 .mm-lower-tray{transform:translateY(-56px)}
      #mmv2-7 .mm-lower-face{transform:translateY(0px)}
      #mmv2-7 .mm-lower-handle-target{opacity:1}
      #mmv2-7 .mm-lower-passage-target{opacity:0}
      #mmv2-7 .mm-mechanism .mm-lower-tray{animation:mmv2-7-tray 4.7s ease-in-out infinite}
