      #mmv2-7 .mm-mechanism .mm-lower-passage-target{animation:mmv2-7-passage-target 4.7s ease-in-out infinite}
      #mmv2-7 .mm-reverse .mm-upper-lid,#mmv2-7 .mm-reverse .mm-upper-under,#mmv2-7 .mm-reverse .mm-upper-outside,#mmv2-7 .mm-reverse .mm-lower-tray,#mmv2-7 .mm-reverse .mm-lower-face,#mmv2-7 .mm-reverse .mm-lower-handle-target,#mmv2-7 .mm-reverse .mm-lower-passage-target{animation-direction:reverse}
      #mmv2-7.mm-paused *{animation-play-state:paused!important}
      #mmv2-7.mm-still *{animation:none!important}
      @keyframes mmv2-7-pulse{0%,100%{fill-opacity:.10;stroke-opacity:.7}50%{fill-opacity:.22;stroke-opacity:1}}
      @keyframes mmv2-7-arrow{0%,100%{opacity:.5}40%,75%{opacity:1}}
      @keyframes mmv2-7-paper{0%,20%{transform:translate(0,0);opacity:1}76%,94%{transform:translate(39px,-28px);opacity:1}100%{transform:translate(39px,-28px);opacity:0}}
      @keyframes mmv2-7-paper-up{0%,20%{transform:translate(0,0);opacity:1}76%,94%{transform:translate(0,-32px);opacity:1}100%{transform:translate(0,-32px);opacity:0}}
      @keyframes mmv2-7-wipe{0%,100%{transform:translateX(-25px)}50%{transform:translateX(25px)}}
      @keyframes mmv2-7-spark{0%,25%,100%{opacity:.15}50%,75%{opacity:1}}
      @keyframes mmv2-7-lid{0%,15%{transform:scaleY(-.85)}65%,100%{transform:scaleY(1)}}
      @keyframes mmv2-7-under{0%,37%{opacity:0}45%,100%{opacity:1}}
      @keyframes mmv2-7-outside{0%,37%{opacity:1}45%,100%{opacity:0}}
      @keyframes mmv2-7-tray{0%,15%{transform:translateY(-56px)}65%,100%{transform:translateY(0)}}
      @keyframes mmv2-7-face{0%,15%{transform:translateY(0)}65%,100%{transform:translateY(56px)}}
      @keyframes mmv2-7-handle-target{0%,20%{opacity:1}48%,100%{opacity:0}}
      @keyframes mmv2-7-passage-target{0%,22%{opacity:0}50%,100%{opacity:1}}
      @media(prefers-reduced-motion:reduce){#mmv2-7 *{animation:none!important}}
