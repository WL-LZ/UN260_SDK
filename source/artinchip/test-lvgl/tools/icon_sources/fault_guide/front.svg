<svg xmlns="http://www.w3.org/2000/svg" id="mmv2-1" viewBox="113 15 254 267" class="mm-model mm-still" data-view="front" data-zone="none" data-action="none" role="img" aria-labelledby="mmv2-1-title" preserveAspectRatio="xMidYMid meet" width="510" height="273"><title id="mmv2-1-title">UN260 正面，整机，none</title><defs>
      <linearGradient id="mmv2-1-body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fa"></stop><stop offset="1" stop-color="#bdccd7"></stop></linearGradient>
      <linearGradient id="mmv2-1-edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8296a5"></stop><stop offset=".45" stop-color="#c8d5de"></stop><stop offset="1" stop-color="#8294a1"></stop></linearGradient>
      <linearGradient id="mmv2-1-dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#364751"></stop><stop offset="1" stop-color="#202e37"></stop></linearGradient>
      <linearGradient id="mmv2-1-steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf4f8"></stop><stop offset=".4" stop-color="#c5d3dc"></stop><stop offset="1" stop-color="#8da2b2"></stop></linearGradient>
      <linearGradient id="mmv2-1-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#425b6a"></stop><stop offset="1" stop-color="#283e4a"></stop></linearGradient>
      <filter id="mmv2-1-shadow" x="-25%" y="-150%" width="150%" height="400%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
      <marker id="mmv2-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#2475cc" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></path></marker>
      <clipPath id="mmv2-1-drawer-mask"><rect x="143" y="176" width="194" height="62"></rect></clipPath>
    </defs><style>
      #mmv2-1{overflow:visible;display:block;isolation:isolate}
      #mmv2-1 .mm-line{stroke:#738996;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}
      #mmv2-1 .mm-fine{fill:none;stroke:#9cabb5;stroke-width:.85;stroke-linecap:round}
      #mmv2-1 .mm-focus{fill:#ef9c36;fill-opacity:.12;stroke:#e29632;stroke-width:2;stroke-linejoin:round;animation:mmv2-1-pulse 2.5s ease-in-out infinite}
      #mmv2-1 .mm-area{stroke-dasharray:4 3}
      #mmv2-1 .mm-arrow{fill:none;stroke:#2475cc;stroke-width:2.4;stroke-linecap:round;marker-end:url(#mmv2-1-arrow);animation:mmv2-1-arrow 2.8s ease-in-out infinite}
      #mmv2-1 .mm-paper{animation:mmv2-1-paper 3.5s ease-in-out infinite}
      #mmv2-1 .mm-paper-up{animation:mmv2-1-paper-up 3.5s ease-in-out infinite}
      #mmv2-1 .mm-wipe{animation:mmv2-1-wipe 3.6s ease-in-out infinite}
      #mmv2-1 .mm-spark{animation:mmv2-1-spark 3.6s ease-in-out infinite}
      #mmv2-1 .mm-upper-lid{transform-origin:240px 126px;transform:scaleY(1)}
      #mmv2-1 .mm-upper-under{opacity:1}
      #mmv2-1 .mm-upper-outside{opacity:0}
      #mmv2-1 .mm-mechanism .mm-upper-lid{animation:mmv2-1-lid 4.7s ease-in-out infinite}
      #mmv2-1 .mm-mechanism .mm-upper-under{animation:mmv2-1-under 4.7s ease-in-out infinite}
      #mmv2-1 .mm-mechanism .mm-upper-outside{animation:mmv2-1-outside 4.7s ease-in-out infinite}
      #mmv2-1 .mm-lower-tray{transform:translateY(-56px)}
      #mmv2-1 .mm-lower-face{transform:translateY(0px)}
      #mmv2-1 .mm-lower-handle-target{opacity:1}
      #mmv2-1 .mm-lower-passage-target{opacity:0}
      #mmv2-1 .mm-mechanism .mm-lower-tray{animation:mmv2-1-tray 4.7s ease-in-out infinite}
      #mmv2-1 .mm-mechanism .mm-lower-face{animation:mmv2-1-face 4.7s ease-in-out infinite}
      #mmv2-1 .mm-mechanism .mm-lower-handle-target{animation:mmv2-1-handle-target 4.7s ease-in-out infinite}
      #mmv2-1 .mm-mechanism .mm-lower-passage-target{animation:mmv2-1-passage-target 4.7s ease-in-out infinite}
      #mmv2-1 .mm-reverse .mm-upper-lid,#mmv2-1 .mm-reverse .mm-upper-under,#mmv2-1 .mm-reverse .mm-upper-outside,#mmv2-1 .mm-reverse .mm-lower-tray,#mmv2-1 .mm-reverse .mm-lower-face,#mmv2-1 .mm-reverse .mm-lower-handle-target,#mmv2-1 .mm-reverse .mm-lower-passage-target{animation-direction:reverse}
      #mmv2-1.mm-paused *{animation-play-state:paused!important}
      #mmv2-1.mm-still *{animation:none!important}
      @keyframes mmv2-1-pulse{0%,100%{fill-opacity:.10;stroke-opacity:.7}50%{fill-opacity:.22;stroke-opacity:1}}
      @keyframes mmv2-1-arrow{0%,100%{opacity:.5}40%,75%{opacity:1}}
      @keyframes mmv2-1-paper{0%,20%{transform:translate(0,0);opacity:1}76%,94%{transform:translate(39px,-28px);opacity:1}100%{transform:translate(39px,-28px);opacity:0}}
      @keyframes mmv2-1-paper-up{0%,20%{transform:translate(0,0);opacity:1}76%,94%{transform:translate(0,-32px);opacity:1}100%{transform:translate(0,-32px);opacity:0}}
      @keyframes mmv2-1-wipe{0%,100%{transform:translateX(-25px)}50%{transform:translateX(25px)}}
      @keyframes mmv2-1-spark{0%,25%,100%{opacity:.15}50%,75%{opacity:1}}
      @keyframes mmv2-1-lid{0%,15%{transform:scaleY(-.85)}65%,100%{transform:scaleY(1)}}
      @keyframes mmv2-1-under{0%,37%{opacity:0}45%,100%{opacity:1}}
      @keyframes mmv2-1-outside{0%,37%{opacity:1}45%,100%{opacity:0}}
      @keyframes mmv2-1-tray{0%,15%{transform:translateY(-56px)}65%,100%{transform:translateY(0)}}
      @keyframes mmv2-1-face{0%,15%{transform:translateY(0)}65%,100%{transform:translateY(56px)}}
      @keyframes mmv2-1-handle-target{0%,20%{opacity:1}48%,100%{opacity:0}}
      @keyframes mmv2-1-passage-target{0%,22%{opacity:0}50%,100%{opacity:1}}
      @media(prefers-reduced-motion:reduce){#mmv2-1 *{animation:none!important}}
    </style><ellipse cx="240" cy="280" rx="110" ry="4" fill="#697f8e" opacity=".16" filter="url(#mmv2-1-shadow)"></ellipse>
