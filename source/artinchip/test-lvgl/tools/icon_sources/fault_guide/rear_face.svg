      @keyframes mmv2-18-tray{0%,15%{transform:translateY(-56px)}65%,100%{transform:translateY(0)}}
      @keyframes mmv2-18-face{0%,15%{transform:translateY(0)}65%,100%{transform:translateY(56px)}}
      @keyframes mmv2-18-handle-target{0%,20%{opacity:1}48%,100%{opacity:0}}
      @keyframes mmv2-18-passage-target{0%,22%{opacity:0}50%,100%{opacity:1}}
      @media(prefers-reduced-motion:reduce){#mmv2-18 *{animation:none!important}}
